<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&amp;family=Karla:wght@400;500&amp;family=Noto+Naskh+Arabic:wght@400;500&amp;display=swap">

<style>
  /* This page's design is self-contained and already carries the RAQI mark,
     so the theme's injected page heading + breadcrumb are hidden.
     Scoped to this page only: this stylesheet loads nowhere else. */
  .m-page-header{display:none}

  .raqi-links{--wine:#7B4A56;--bone:#F3F0E8;--ink:#22261F;
    max-width:520px;margin:0 auto;padding:56px 24px 80px;
    font-family:'Karla',system-ui,sans-serif;color:var(--ink);text-align:center}
  .raqi-links *{box-sizing:border-box}
  .raqi-links .rl-mark{width:112px;height:118px;margin:0 auto 26px;border:1.5px solid var(--wine);
    border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
  .raqi-links .rl-ar{font-family:'Noto Naskh Arabic',serif;font-size:26px;color:var(--wine);line-height:1}
  .raqi-links .rl-en{font-family:'Italiana',serif;font-size:17px;letter-spacing:5px;
    padding-left:5px;color:var(--wine)}
  .raqi-links .rl-tag{font-family:'Italiana',serif;font-size:19px;color:var(--wine);margin:0 0 6px}
  .raqi-links .rl-sub{font-size:14px;color:rgba(34,38,31,.6);margin:0 0 38px}
  .raqi-links .rl-btn{display:flex;align-items:center;justify-content:space-between;gap:14px;
    width:100%;padding:17px 22px;margin-bottom:12px;border:1px solid rgba(123,74,86,.35);
    border-radius:2px;background:transparent;color:var(--wine);text-decoration:none;
    font-size:15px;letter-spacing:.06em;transition:background .2s,border-color .2s}
  .raqi-links .rl-btn:visited{color:var(--wine)}
  .raqi-links .rl-btn:hover{background:var(--wine);border-color:var(--wine);color:var(--bone)}
  .raqi-links .rl-btn .rl-l{display:flex;align-items:center;gap:13px}
  .raqi-links .rl-btn svg{width:19px;height:19px;flex:none}
  .raqi-links .rl-btn .rl-ara{font-family:'Noto Naskh Arabic',serif;font-size:13px;opacity:.72}
  .raqi-links .rl-foot{margin-top:34px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(34,38,31,.45)}

  /* Narrow phones (375px and down): trim padding and tracking just enough to
     keep every button label on a single line. */
  @media (max-width:400px){
    .raqi-links{padding-left:18px;padding-right:18px}
    .raqi-links .rl-btn{padding:16px 16px;gap:10px;letter-spacing:.03em}
    .raqi-links .rl-btn .rl-l{gap:11px}
    .raqi-links .rl-btn .rl-ara{white-space:nowrap}
  }
  @media (max-width:370px){
    .raqi-links .rl-btn{font-size:14px;padding:16px 14px;gap:8px}
    .raqi-links .rl-btn .rl-ara{font-size:12px}
  }
  @media (max-width:340px){
    .raqi-links{padding-left:14px;padding-right:14px}
    .raqi-links .rl-btn{font-size:13px;padding:15px 12px}
  }
</style>
